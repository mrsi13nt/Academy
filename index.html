function getYouTubeEmbedUrl(url) {
  if (!url) return "";
  if (url.includes("embed/")) return url;
  const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
  const match = url.match(regExp);
  return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
}

/* =========================================================================
   AUTH CONTEXT (WITH LOCALSTORAGE PERSISTENCE)
========================================================================= */
const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

function AuthProvider({ children }) {
  const [currentUser, setCurrentUser] = useState(() => {
    const saved = localStorage.getItem("vanguards_user");
    return saved ? JSON.parse(saved) : null;
  });
  const [authLoading, setAuthLoading] = useState(false);

  const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  const signup = ({ name, email, password, confirmPassword }) => {
    return new Promise((resolve, reject) => {
      if (!name.trim()) return reject("Please enter your full name.");
      if (!validateEmail(email)) return reject("The email address is badly formatted.");
      if (password.length < 6) return reject("Password should be at least 6 characters.");
      if (password !== confirmPassword) return reject("Passwords do not match.");
      setAuthLoading(true);
      setTimeout(() => {
        setAuthLoading(false);
        // If email contains admin or is admin@vanguards.com, grant admin rights
        const isAdmin = email.toLowerCase().includes("admin") || email.toLowerCase() === "coach@vanguards.com";
        const user = { uid: "user-" + Date.now(), name, email, isAdmin };
        setCurrentUser(user);
        localStorage.setItem("vanguards_user", JSON.stringify(user));
        resolve(user);
      }, 700);
    });
  };

  const login = ({ email, password }) => {
    return new Promise((resolve, reject) => {
      if (!validateEmail(email)) return reject("The email address is badly formatted.");
      if (password.length < 6) return reject("Wrong password. Minimum 6 characters.");
      setAuthLoading(true);
      setTimeout(() => {
        setAuthLoading(false);
        const isAdmin = email.toLowerCase().includes("admin") || email.toLowerCase() === "coach@vanguards.com";
        const user = { uid: "user-" + Date.now(), name: email.split("@")[0], email, isAdmin };
        setCurrentUser(user);
        localStorage.setItem("vanguards_user", JSON.stringify(user));
        resolve(user);
      }, 700);
    });
  };

  const logout = () => {
    setCurrentUser(null);
    localStorage.removeItem("vanguards_user");
  };

  return (
    <AuthContext.Provider value={{ currentUser, authLoading, signup, login, logout }}>
      {children}
    </AuthContext.Provider>
  );
}

function AuthPage({ authMode, setAuthMode, setView }) {

  if (!isOpen) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    const newVideo = {
      id: "v-" + Date.now(),
      title: form.title,
      category: form.category,
      level: form.level,
      duration: form.duration,
      videoUrl: getYouTubeEmbedUrl(form.videoUrl),
      description: form.description,
      takeaways: form.takeaways.split("\n").filter(Boolean),
      drills: form.drills
    };
    onAddVideo(newVideo);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div className="bg-neutral-900 border border-neutral-800 rounded-xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-lg font-semibold text-white">Add New Training Video</h2>
          <button onClick={onClose} className="text-neutral-400 hover:text-white"><X className="w-5 h-5" /></button>
        </div>
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-xs font-medium text-neutral-400 mb-1">Video Title</label>
            <input required value={form.title} onChange={e => setForm({...form, title: e.target.value})} placeholder="e.g. Advanced Elbow Counters" className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-medium text-neutral-400 mb-1">Category</label>
              <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white">
                <option>Striking</option><option>BJJ</option><option>Grappling</option><option>Conditioning</option>
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-neutral-400 mb-1">Level</label>
              <select value={form.level} onChange={e => setForm({...form, level: e.target.value})} className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white">
                <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
              </select>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-medium text-neutral-400 mb-1">Duration</label>
              <input value={form.duration} onChange={e => setForm({...form, duration: e.target.value})} placeholder="12:30" className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white" />
            </div>
            <div>
              <label className="block text-xs font-medium text-neutral-400 mb-1">YouTube Link / Embed URL</label>
              <input required value={form.videoUrl} onChange={e => setForm({...form, videoUrl: e.target.value})} placeholder="https://youtu.be/..." className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white" />
            </div>
          </div>
          <div>
            <label className="block text-xs font-medium text-neutral-400 mb-1">Description</label>
            <textarea required rows="3" value={form.description} onChange={e => setForm({...form, description: e.target.value})} className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white" placeholder="Technique breakdown..." />
          </div>
          <div>
            <label className="block text-xs font-medium text-neutral-400 mb-1">Key Takeaways (one per line)</label>
            <textarea rows="2" value={form.takeaways} onChange={e => setForm({...form, takeaways: e.target.value})} className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white" placeholder="Keep chin tucked&#10;Rotate hips fully" />
          </div>
          <div>
            <label className="block text-xs font-medium text-neutral-400 mb-1">Drill Instructions</label>
            <input value={form.drills} onChange={e => setForm({...form, drills: e.target.value})} placeholder="5 rounds x 2 mins" className="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-sm text-white" />
          </div>
          <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded text-sm transition-all">Publish Video</button>
        </form>
      </div>
    </div>
  );
}

/* =========================================================================
   DASHBOARD / VIDEO LIBRARY
========================================================================= */
const CATEGORIES = ["Striking", "BJJ", "Grappling", "Conditioning"];
const LEVELS = ["Beginner", "Intermediate", "Advanced"];

function Dashboard({ setView, setAuthMode }) {
  const { currentUser } = useAuth();
  const [videos, setVideos] = useState(() => {
    const saved = localStorage.getItem("vanguards_videos");
    return saved ? JSON.parse(saved) : INITIAL_VIDEOS;
  });

  const [activeCategories, setActiveCategories] = useState([]);
  const [activeLevel, setActiveLevel] = useState("All");
  const [search, setSearch] = useState("");
  const [completedIds, setCompletedIds] = useState(new Set());
  const [openVideo, setOpenVideo] = useState(null);
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);

  if (!currentUser) return <AuthPage authMode="login" setAuthMode={setAuthMode} setView={setView} />;

  const handleAddVideo = (newVideo) => {
    const updated = [newVideo, ...videos];
    setVideos(updated);
    localStorage.setItem("vanguards_videos", JSON.stringify(updated));
  };

  const toggleCategory = (cat) => {
    setActiveCategories((prev) => prev.includes(cat) ? prev.filter((c) => c !== cat) : [...prev, cat]);
  };

  const toggleComplete = (id) => {
    setCompletedIds((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const filteredVideos = useMemo(() => {
    return videos.filter((v) => {
      const matchCat = activeCategories.length === 0 || activeCategories.includes(v.category);
      const matchLevel = activeLevel === "All" || v.level === activeLevel;
      const matchSearch = v.title.toLowerCase().includes(search.toLowerCase());
      return matchCat && matchLevel && matchSearch;
    });
  }, [videos, activeCategories, activeLevel, search]);

  return (
    <div className="min-h-[calc(100vh-4rem)] bg-black py-8">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex items-center justify-between mb-8 flex-wrap gap-4">
          <div>
            <span className="text-xs font-semibold tracking-[0.25em] text-red-500">THE LIBRARY</span>
            <h1 className="text-3xl md:text-4xl text-white" style={{ fontFamily: "'Bebas Neue', sans-serif" }}>
              WELCOME BACK, {currentUser.name.toUpperCase()}
            </h1>
          </div>
          {currentUser.isAdmin && (
            <button
              onClick={() => setIsAddModalOpen(true)}
              className="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white font-semibold text-sm px-4 py-2.5 rounded-md transition-all"
            >
              <Plus className="w-4 h-4" /> Add New Video
            </button>
          )}
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-8">
          <aside className="bg-neutral-900 border border-neutral-800 rounded-lg p-5 space-y-6 h-fit">
            <div>
              <label className="block text-xs font-semibold text-neutral-400 mb-2">SEARCH</label>
              <div className="relative">
                <Search className="w-4 h-4 text-neutral-500 absolute left-3 top-1/2 -translate-y-1/2" />
                <input
                  value={search} onChange={(e) => setSearch(e.target.value)}
                  placeholder="Find technique..."
                  className="w-full bg-neutral-950 border border-neutral-800 rounded pl-9 pr-3 py-2 text-sm text-white outline-none focus:border-red-600"
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-semibold text-neutral-400 mb-2">CATEGORY</label>
              <div className="space-y-2">
                {CATEGORIES.map((cat) => (
                  <button
                    key={cat} onClick={() => toggleCategory(cat)}
                    className={`w-full flex items-center justify-between text-sm px-3 py-2 rounded border transition-all ${
                      activeCategories.includes(cat) ? "bg-red-600/10 border-red-700/50 text-red-400" : "border-neutral-800 text-neutral-400"
                    }`}
                  >
                    <span>{cat}</span>
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-xs font-semibold text-neutral-400 mb-2">DIFFICULTY</label>
              <div className="flex flex-wrap gap-2">
                {["All", ...LEVELS].map((lvl) => (
                  <button
                    key={lvl} onClick={() => setActiveLevel(lvl)}
                    className={`text-xs font-medium px-3 py-1.5 rounded-full border transition-all ${
                      activeLevel === lvl ? "bg-red-600 border-red-600 text-white" : "border-neutral-800 text-neutral-400"
                    }`}
                  >
                    {lvl}
                  </button>
                ))}
              </div>
            </div>
          </aside>

          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
            {filteredVideos.map((video) => {
              const catStyle = CATEGORY_STYLES[video.category] || CATEGORY_STYLES.Striking;
              const isCompleted = completedIds.has(video.id);
              return (
                <div
                  key={video.id} onClick={() => setOpenVideo(video)}
                  className="group bg-neutral-900 border border-neutral-800 hover:border-red-800/60 rounded-lg overflow-hidden cursor-pointer transition-all"
                >
                  <div className="relative h-40 bg-neutral-950 flex items-center justify-center overflow-hidden">
                    <Video className="w-12 h-12 text-neutral-700 group-hover:text-red-500 transition-colors" />
                    <span className="absolute bottom-2 right-2 bg-black/70 text-neutral-300 text-[11px] px-2 py-0.5 rounded flex items-center gap-1">
                      <Clock className="w-3 h-3" /> {video.duration}
                    </span>
                  </div>
                  <div className="p-4 border-t border-neutral-800">
                    <div className="flex gap-2 mb-2">
                      <span className={`text-[10px] font-semibold px-2 py-0.5 rounded border ${catStyle.chip}`}>{video.category}</span>
                      <span className={`text-[10px] font-semibold px-2 py-0.5 rounded border ${LEVEL_STYLES[video.level]}`}>{video.level}</span>
                    </div>
                    <h3 className="text-white font-semibold text-sm">{video.title}</h3>
                    <button
                      onClick={(e) => { e.stopPropagation(); toggleComplete(video.id); }}
                      className={`mt-3 flex items-center gap-1.5 text-xs font-medium ${isCompleted ? "text-emerald-400" : "text-neutral-500 hover:text-neutral-300"}`}
                    >
                      {isCompleted ? <CheckCircle2 className="w-4 h-4" /> : <Circle className="w-4 h-4" />}
                      {isCompleted ? "Completed" : "Mark as Completed"}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {openVideo && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={() => setOpenVideo(null)}>
          <div onClick={e => e.stopPropagation()} className="bg-neutral-900 border border-neutral-800 rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center p-5 border-b border-neutral-800">
              <h2 className="text-xl text-white font-semibold">{openVideo.title}</h2>
              <button onClick={() => setOpenVideo(null)} className="text-neutral-400 hover:text-white"><X className="w-5 h-5" /></button>
            </div>
            <div className="aspect-video bg-black">
              <iframe src={openVideo.videoUrl} title={openVideo.title} className="w-full h-full" allowFullScreen />
            </div>
            <div className="p-6 space-y-4">
              <p className="text-sm text-neutral-300">{openVideo.description}</p>
              <div>
                <h4 className="text-xs font-semibold text-white uppercase mb-2">Key Takeaways</h4>
                <ul className="list-disc list-inside text-sm text-neutral-400 space-y-1">
                  {openVideo.takeaways?.map((t, i) => <li key={i}>{t}</li>)}
                </ul>
              </div>
            </div>
          </div>
        </div>
      )}

      <AddVideoModal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} onAddVideo={handleAddVideo} />
    </div>
  );
}

export default function App() {
  const [view, setView] = useState("landing");
  const [authMode, setAuthMode] = useState("login");

  return (
    <AuthProvider>
      <div className="bg-black min-h-screen flex flex-col">
        <Header view={view} setView={setView} setAuthMode={setAuthMode} />
        <main className="flex-1">
          {view === "landing" && <Landing setView={setView} setAuthMode={setAuthMode} />}
          {view === "auth" && <AuthPage authMode={authMode} setAuthMode={setAuthMode} setView={setView} />}
          {view === "dashboard" && <Dashboard setView={setView} setAuthMode={setAuthMode} />}
        </main>
        <Footer setView={setView} />
      </div>
    </AuthProvider>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
